<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Evrard AYIDEDJI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="particle-canvas"></canvas>

<header class="glass-header">
    <div class="logo">Evrard<span>.dev</span></div>
    <div class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></div>
    <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="nav-link">Accueil</a></li>
        <li><a href="competences.html" class="nav-link">Compétences</a></li>
        <li><a href="projets.html" class="nav-link">Projets</a></li>
        <li><a href="parcours.html" class="nav-link">Parcours</a></li>
        <li><a href="contact.html" class="nav-link active">Contact</a></li>
    </ul>
</header>

<main>
    <section id="contact">
        <h2 class="section-title">Restons <span>connectés</span></h2>
        <div class="contact-form fade-up">
            <form id="formContact" action="https://formspree.io/f/xvzbwqvg" method="POST">
                <input type="text" name="name" placeholder="Votre nom complet" required pattern="[A-Za-zÀ-ÿ\s]{2,50}">
                <input type="email" name="email" placeholder="Adresse email" required>
                <textarea name="message" rows="4" placeholder="Votre message inspiré..." required minlength="10"></textarea>
                <button type="submit" class="btn btn-primary" style="width:100%;"><i class="fas fa-paper-plane"></i> Envoyer le message</button>
                <div id="formStatus" style="margin-top: 12px; text-align:center;"></div>
            </form>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="social-links">
        <a href="#"><i class="fab fa-github"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
    </div>
    <p style="margin-top: 1rem;">© 2026 AYIDEDJI M. Evrard — Détermination & Excellence</p>
</footer>

<script>
    const contactForm = document.getElementById('formContact');
    const statusDiv = document.getElementById('formStatus');
    if (contactForm) {
        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(contactForm);
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Envoi en cours...';
            try {
                const resp = await fetch(contactForm.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
                if (resp.ok) {
                    statusDiv.innerHTML = '<span style="color:#00f5a0;">✅ Message envoyé avec succès !</span>';
                    contactForm.reset();
                } else {
                    statusDiv.innerHTML = '<span style="color:#ff7777;">❌ Erreur, réessayez plus tard.</span>';
                }
            } catch (err) {
                statusDiv.innerHTML = '<span style="color:#ff7777;">⚠️ Problème réseau.</span>';
            }
        });
    }
</script>
<script src="main.js"></script>
</body>
</html>
